# nix-vault configuration: ~/.config/nix-vault/config.toml
#
# Each top-level table is a profile with one host and one authentication type, `basic` or
# `oauth2`. A profile has up to three kinds of sub-table:
#   - the sub-table named after its type holds the authentication settings (`[<profile>.oauth2]`;
#     basic profiles have none, they are asked for a username and password at login);
#   - `[<profile>.nix]` chooses how credentials reach Nix: `use` lists the mechanisms
#     (`"access-token"`, `"netrc"` or both) and `access-token-style` renders the access token.
# The file never holds usernames, passwords or tokens: `nix-vault login` asks for them and keeps
# them in the system keychain. Endpoint values below are illustrative; they must match the real
# service.

# A private binary cache that needs a login. Basic profiles are presented to Nix through netrc
# unless you say otherwise.
[cache]
host = "cache.example.com"
type = "basic"

# A self-hosted GitLab used by flake inputs. OAuth profiles are presented to Nix as an access
# token (`OAuth2:<token>`) unless you add sub-tables.
[company]
host = "gitlab.example.com"
type = "oauth2"

[company.oauth2]
client_id = "public-client-id"            # a public client: there is no client secret
flow = "device"                           # or "authorization_code" (with PKCE)
device_authorization_endpoint = "https://gitlab.example.com/oauth/authorize_device"
token_endpoint = "https://gitlab.example.com/oauth/token"
scopes = ["read_api"]

# github.com with the authorization code flow. The access token is the bare token for this host.
[github]
host = "github.com"
type = "oauth2"

[github.oauth2]
client_id = "your-github-oauth-app-client-id"
flow = "authorization_code"
authorization_endpoint = "https://github.com/login/oauth/authorize"
token_endpoint = "https://github.com/login/oauth/access_token"
scopes = ["repo"]

# One profile presented through both mechanisms: as an access token (for Nix's forge fetchers)
# and through netrc (for HTTP downloads and caches on the same host).
[mono]
host = "git.example.com"
type = "oauth2"

[mono.oauth2]
client_id = "another-public-client-id"
flow = "device"
device_authorization_endpoint = "https://git.example.com/oauth/authorize_device"
token_endpoint = "https://git.example.com/oauth/token"

[mono.nix]
use = ["access-token", "netrc"]   # default: ["access-token"] for oauth2, ["netrc"] for basic.
                                  # The netrc login is the username given at login (basic
                                  # profiles) or "oauth2" (OAuth profiles).
access-token-style = "typed"      # "plain" renders host=<token> (github.com, Gitea, Forgejo, ...);
                                  # "typed" renders host=OAuth2:<token> (host=PAT:<token> for
                                  # basic profiles), which is what GitLab expects. Default: plain
                                  # for github.com, typed for every other host. Only valid when
                                  # "use" includes "access-token".
